services:
  grow:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8091}:8000"
    environment:
      DATA_DIR: /data
      DEMO_MODE: "1"
    volumes:
      - grow-demo-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  grow-demo-data:
